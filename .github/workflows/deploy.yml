name: Deploy

# Deploys main to the VPS, but only after CI passed for that exact commit.
# Turned off until the VPS is ready: set the repository variable DEPLOY_ENABLED=true
# (Settings → Secrets and variables → Actions → Variables). See README → Deploy.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer one waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - name: Pull, rebuild and restart on the VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          APP_DIR: ${{ vars.APP_DIR || 'pomopal' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          envs: DEPLOY_SHA,APP_DIR
          command_timeout: 10m
          script: |
            set -eu
            cd "$APP_DIR"
            git fetch --prune origin
            git checkout --detach "$DEPLOY_SHA"
            # --wait returns only when every container is healthy (migrations ran, /api/health is ok).
            docker compose up -d --build --wait --wait-timeout 180
            docker image prune -f
            echo "Deployed $DEPLOY_SHA"
