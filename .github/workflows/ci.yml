name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pomopal
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: pomopal
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pomopal -d pomopal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pomopal:ci-only@localhost:5432/pomopal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Schema and migrations are in sync
        run: |
          npx drizzle-kit generate --name ci-check
          if [ -n "$(git status --porcelain server/db/migrations)" ]; then
            echo "::error::server/db/schema.ts changed without a migration. Run 'npm run db:generate' and commit the result."
            git status --short server/db/migrations
            exit 1
          fi
      - name: Migrations apply to an empty database (twice)
        run: npm run db:migrate && npm run db:migrate
      - name: Shop seed is idempotent (twice)
        run: npm run db:seed && npm run db:seed

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
