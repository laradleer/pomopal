# PomoPal: https://pomopal.viten.io → the app container on 127.0.0.1:3420 (APP_PORT in .env).
# Installed as /etc/nginx/sites-available/pomopal.viten.io, linked from sites-enabled.
# The HTTPS lines marked "managed by Certbot" were added by `certbot --nginx`.

# WebSocket-ready: send "Connection: upgrade" only when the browser asks for an upgrade.
map $http_upgrade $pomopal_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name pomopal.viten.io;

    # The API only takes small JSON bodies.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3420;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pomopal_connection_upgrade;

        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pomopal.viten.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pomopal.viten.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = pomopal.viten.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name pomopal.viten.io;
    return 404; # managed by Certbot


}